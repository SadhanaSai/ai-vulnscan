    repo: e2b-dev/e2b-python
    agentic_context: "Sandboxed code execution for code agents"
    enabled: true
  - name: docker
    ecosystem: pypi
    layer: infrastructure
    repo: docker/docker-py
    agentic_context: "Container execution used by code agents"
    enabled: true
  - name: httpx
    ecosystem: pypi
    layer: infrastructure
    repo: encode/httpx
