# Package watchlist — cve-agent-spec.md §3
#
# layer: "framework" | "sdk" | "mcp" | "infrastructure"
# ecosystem: "pypi" | "npm"
# repo: GitHub "org/repo" used for commit/issue/PR/GHSA lookups
# agentic_context: optional free-text used by the LLM to write sharper
#   CVE descriptions and agentic-uplift analysis (Phases 2+)
# enabled: false packages are skipped by all pipelines but stay listed here

packages:
  # --- Layer 1: AI Frameworks ---
  - name: langchain
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
  - name: langchain-core
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
