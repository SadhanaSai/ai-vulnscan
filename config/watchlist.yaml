  # --- Layer 4: Agentic infrastructure ---
  - name: chromadb
    ecosystem: pypi
    layer: infrastructure
    repo: chroma-core/chroma
    agentic_context: "RAG vector store used in LangChain, LlamaIndex"
    enabled: true
  - name: faiss-cpu
    ecosystem: pypi
    layer: infrastructure
    repo: facebookresearch/faiss
    agentic_context: "Embedding search layer in RAG pipelines"
    enabled: true
  - name: qdrant-client
