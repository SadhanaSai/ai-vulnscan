# Package watchlist — cve-agent-spec.md §3
#
# layer: "framework" | "sdk" | "mcp" | "infrastructure"
# ecosystem: "pypi" | "npm"
# repo: GitHub "org/repo" used for commit/issue/PR/GHSA lookups
# path_prefix: optional — set this when `repo` is a monorepo hosting other
#   unrelated packages (e.g. Azure SDK's shared repo, the archived MCP
#   servers repo). Scopes commit/PR/pattern-hunt signals to files under this
#   path so an unrelated sibling package's activity doesn't get misattributed
#   here. Omit for single-package repos — no filtering is applied.
# agentic_context: optional free-text used by the LLM to write sharper
#   CVE descriptions and agentic-uplift analysis (Phases 2+)
# enabled: false packages are skipped by all pipelines but stay listed here

packages:
  # --- Layer 1: AI Frameworks ---
  - name: langchain
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
  - name: langchain-core
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
  - name: langchain-community
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
  - name: langchain-experimental
    ecosystem: pypi
    layer: framework
    repo: langchain-ai/langchain
    agentic_context: null
    enabled: true
  - name: llama-index
    ecosystem: pypi
    layer: framework
    repo: run-llama/llama_index
    agentic_context: null
    enabled: true
  - name: llama-index-core
    ecosystem: pypi
    layer: framework
    repo: run-llama/llama_index
    agentic_context: null
    enabled: true
  - name: crewai
    ecosystem: pypi
    layer: framework
    repo: crewAIInc/crewAI
    agentic_context: null
    enabled: true
  - name: autogen
    ecosystem: pypi
    layer: framework
    repo: microsoft/autogen
    agentic_context: null
    enabled: true
  - name: autogen-agentchat
    ecosystem: pypi
    layer: framework
    repo: microsoft/autogen
    agentic_context: null
    enabled: true
  - name: haystack-ai
    ecosystem: pypi
    layer: framework
    repo: deepset-ai/haystack
    agentic_context: null
    enabled: true
  - name: smolagents
    ecosystem: pypi
    layer: framework
    repo: huggingface/smolagents
    agentic_context: null
    enabled: true
  - name: pydantic-ai
    ecosystem: pypi
    layer: framework
    repo: pydantic/pydantic-ai
    agentic_context: null
    enabled: true
  - name: dspy-ai
    ecosystem: pypi
    layer: framework
    repo: stanfordnlp/dspy
    agentic_context: null
    enabled: true
  - name: litellm
    ecosystem: pypi
    layer: framework
    repo: BerriAI/litellm
    agentic_context: null
    enabled: true
  - name: langflow
    ecosystem: pypi
    layer: framework
    # logspace-ai org renamed to langflow-ai; old path 422s on commit search
    # since GitHub's search API doesn't follow repo-rename redirects.
    repo: langflow-ai/langflow
    agentic_context: null
    enabled: true

  # --- Layer 2: AI SDKs and clients ---
  - name: anthropic
    ecosystem: pypi
    layer: sdk
    repo: anthropics/anthropic-sdk-python
    agentic_context: null
    enabled: true
  - name: openai
    ecosystem: pypi
    layer: sdk
    repo: openai/openai-python
    agentic_context: null
    enabled: true
  - name: google-generativeai
    ecosystem: pypi
    layer: sdk
    # Upstream repo was renamed/archived by Google; still actively released
    # on PyPI (0.8.6, 2025-12-16), so kept in the watchlist. GitHub's search
    # API 422s on the old path since it doesn't follow repo-rename redirects.
    repo: google-gemini/deprecated-generative-ai-python
    agentic_context: null
    enabled: true
  - name: mistralai
    ecosystem: pypi
    layer: sdk
    repo: mistralai/client-python
    agentic_context: null
    enabled: true
  - name: cohere
    ecosystem: pypi
    layer: sdk
    repo: cohere-ai/cohere-python
    agentic_context: null
    enabled: true
  - name: boto3
    ecosystem: pypi
    layer: sdk
    repo: boto/boto3
    agentic_context: "Bedrock client context — used to call Bedrock-hosted models"
    enabled: true
  - name: azure-ai-inference
    ecosystem: pypi
    layer: sdk
    # Monorepo hosting dozens of unrelated Azure SDKs — path_prefix scopes
    # signals to this package specifically. Discovered 2026-08-12 after a
    # Lane 1A finding turned out to be a misattributed azure-storage-blob PR.
    repo: Azure/azure-sdk-for-python
    path_prefix: sdk/ai/azure-ai-inference/
    agentic_context: null
    enabled: true
  - name: claude-agent-sdk
    ecosystem: pypi
    layer: sdk
    # Public repo, real src/ tree (confirmed 2026-08-30, unlike anthropics/
    # claude-code below). Bundles the Claude Code CLI runtime and supports
    # in-process custom MCP tools.
    repo: anthropics/claude-agent-sdk-python
    agentic_context: "Agent-building SDK — tool authorization, default permission scope, subprocess/MCP trust boundaries, local file/workspace isolation are the load-bearing security surfaces"
    enabled: true

  # --- Layer 3: MCP ecosystem ---
  - name: mcp
    ecosystem: pypi
    layer: mcp
    repo: modelcontextprotocol/python-sdk
    agentic_context: null
    enabled: true
  - name: "@modelcontextprotocol/sdk"
    ecosystem: npm
    layer: mcp
    repo: modelcontextprotocol/typescript-sdk
    agentic_context: null
    enabled: true
  - name: "@modelcontextprotocol/inspector"
    ecosystem: npm
    layer: mcp
    repo: modelcontextprotocol/inspector
    agentic_context: null
    enabled: true
  - name: mcp-server-filesystem
    ecosystem: npm
    layer: mcp
    repo: modelcontextprotocol/servers
    agentic_context: null
    enabled: true
  - name: mcp-server-git
    ecosystem: npm
    layer: mcp
    repo: modelcontextprotocol/servers
    agentic_context: null
    enabled: true
  - name: "@modelcontextprotocol/server-github"
    ecosystem: npm
    layer: mcp
    # Was "mcp-server-github" pointing at an unrelated unscoped npm package
    # (a disclosed npm name-confusion research canary, theinfosecguy/npx-canary
    # — not the real MCP server) and modelcontextprotocol/servers, which no
    # longer hosts this server. Corrected 2026-08-12. Real package is
    # deprecated upstream ("no longer supported") — disabled, not removed,
    # since existing installs may still be worth tracking for known CVEs.
    repo: modelcontextprotocol/servers-archived
    path_prefix: src/github/
    agentic_context: null
    enabled: false
  - name: "@modelcontextprotocol/server-slack"
    ecosystem: npm
    layer: mcp
    # Was "mcp-server-slack" pointing at an unrelated third-party npm package
    # (not the real MCP server, not the canary either — just a different
    # unaffiliated maintainer's package that happened to share the name).
    # Corrected 2026-08-12. Real package is deprecated upstream — disabled.
    repo: modelcontextprotocol/servers-archived
    path_prefix: src/slack/
    agentic_context: null
    enabled: false
  - name: "@modelcontextprotocol/server-postgres"
    ecosystem: npm
    layer: mcp
    # Was "mcp-server-postgres" pointing at the same npx-canary research
    # package as mcp-server-github (see above). Corrected 2026-08-12. Real
    # package is deprecated upstream — disabled.
    repo: modelcontextprotocol/servers-archived
    path_prefix: src/postgres/
    agentic_context: null
    enabled: false
  - name: mcp-remote
    ecosystem: npm
    layer: mcp
    # Third-party bridge tool, not part of the official MCP servers monorepo
    # despite the name — npm's own registry metadata for this package points
    # here (repository field), confirmed 2026-08-05.
    repo: geelen/mcp-remote
    agentic_context: null
    enabled: true

  # --- Layer 4: Agentic infrastructure ---
  - name: chromadb
    ecosystem: pypi
    layer: infrastructure
    repo: chroma-core/chroma
    agentic_context: "RAG vector store used in LangChain, LlamaIndex"
    enabled: true
  - name: faiss-cpu
    ecosystem: pypi
    layer: infrastructure
    repo: facebookresearch/faiss
    agentic_context: "Embedding search layer in RAG pipelines"
    enabled: true
  - name: qdrant-client
    ecosystem: pypi
    layer: infrastructure
    repo: qdrant/qdrant-client
    agentic_context: "Vector store used in agentic retrieval"
    enabled: true
  - name: weaviate-client
    ecosystem: pypi
    layer: infrastructure
    repo: weaviate/weaviate-python-client
    agentic_context: "Vector store used in agentic retrieval"
    enabled: true
  - name: e2b
    ecosystem: pypi
    layer: infrastructure
    # e2b-dev/e2b-python doesn't exist (404) — PyPI's own project_urls says
    # the Python SDK lives inside the e2b-dev/e2b monorepo at
    # packages/python-sdk. GitHub search doesn't support subdirectory
    # scoping, so we point at the monorepo root.
    repo: e2b-dev/e2b
    agentic_context: "Sandboxed code execution for code agents"
    enabled: true
  - name: docker
    ecosystem: pypi
    layer: infrastructure
    repo: docker/docker-py
    agentic_context: "Container execution used by code agents"
    enabled: true
  - name: httpx
    ecosystem: pypi
    layer: infrastructure
    repo: encode/httpx
    agentic_context: "Async HTTP used in tool calls"
    enabled: true
  - name: aiohttp
    ecosystem: pypi
    layer: infrastructure
    repo: aio-libs/aiohttp
    agentic_context: "Async HTTP used in tool calls"
    enabled: true
  - name: celery
    ecosystem: pypi
    layer: infrastructure
    repo: celery/celery
    agentic_context: "Task queue used for agent orchestration"
    enabled: true
  - name: lancedb
    ecosystem: pypi
    layer: infrastructure
    repo: lancedb/lancedb
    agentic_context: "Serverless vector database (columnar Lance format) for multimodal retrieval"
    enabled: true
  - name: bentoml
    ecosystem: pypi
    layer: infrastructure
    repo: bentoml/BentoML
    agentic_context: "Model-serving framework packaging ML models into production microservices"
    enabled: true
  - name: transformers
    ecosystem: pypi
    layer: framework
    repo: huggingface/transformers
    agentic_context: "Core model loading/inference pipeline underlying many agent stacks — recurring unsafe deserialization RCE pattern across model-checkpoint loading"
    enabled: true
  - name: vllm
    ecosystem: pypi
    layer: infrastructure
    repo: vllm-project/vllm
    agentic_context: "High-throughput LLM inference/serving engine"
    enabled: true
  - name: open-webui
    ecosystem: pypi
    layer: framework
    repo: open-webui/open-webui
    agentic_context: "Self-hosted local AI chat frontend"
    enabled: true
  - name: ollama
    ecosystem: npm
    layer: sdk
    repo: ollama/ollama-js
    agentic_context: "JS client for local Ollama models — Windows build has had an unsigned-update RCE"
    enabled: true
  - name: "@anthropic-ai/claude-code-action"
    ecosystem: npm
    layer: infrastructure
    # Not actually published to npm (registry 404, confirmed 2026-08-30) —
    # consumed via GitHub Action repo-tag reference, not `npm install`.
    # ecosystem set to npm only to satisfy the schema; Phase 7 version
    # resolution has no package to pin and will no-op for this entry.
    repo: anthropics/claude-code-action
    agentic_context: "GitHub Action running Claude Code in CI against untrusted PR/issue content — action-input injection, token leakage, fork/branch trust confusion are the relevant surfaces"
    enabled: true
